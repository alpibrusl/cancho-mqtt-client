name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The cancho-mqtt commit whose `mqtt.wire` is the other implementation of the byte layout (design section 9, gate 1): the commit
  # cancho-industrial's bundle.toml pins. The compiler is the release pinned in cancho.toml, installed prebuilt; the broker is built by that
  # same compiler (with --ignore-compiler-rev: its own cancho.toml names an older commit).
  BROKER_REV: ac2cde4434279d758dd8b4329a174f1fead6cb57

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-mqtt
          ref: ${{ env.BROKER_REV }}
          path: cancho-mqtt

      - name: Install the pinned compiler
        working-directory: client
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CANCHO=$HOME/.local/bin/cancho" >> "$GITHUB_ENV"

      - name: Format
        working-directory: client
        run: cancho fmt --check src tests examples

      - name: Gates 1, 2 and 6, the tests (the codec's own and against cancho-mqtt's wire)
        working-directory: client
        run: |
          cancho test src/codec.cho tests/codec_test.cho --std
          # an absolute path: this compiler refuses a source path with `..` in it ("cannot read the file")
          cancho test "$GITHUB_WORKSPACE/cancho-mqtt/src/wire.cho" src/codec.cho tests/broker_test.cho --std
          cancho test src/codec.cho src/client.cho tests/client_test.cho --std

      - name: Gate, slice 6, the package stores are the stores of the sources, and a program built from the fetched stores is the program built from the sources
        working-directory: client
        run: |
          sh tests/stores.sh
          for e in pub sub will watch; do sh tests/consume.sh $e; done

      - name: Build the broker
        working-directory: cancho-mqtt
        run: cancho build --ignore-compiler-rev

      - name: Gate 3, the examples against the real broker
        working-directory: client
        env:
          BROKER: ${{ github.workspace }}/cancho-mqtt/build/mqtt
        run: |
          scripts/e2e.sh
          sh tests/consume.sh --out "$RUNNER_TEMP/storebin"
          E2E_BIN="$RUNNER_TEMP/storebin" scripts/e2e.sh 18831

      - name: Gate 7, every variant must be killed
        working-directory: client
        env:
          BROKER: ${{ github.workspace }}/cancho-mqtt/build/mqtt
        run: python3 scripts/mutants.py

      - name: Gate 8, lines
        working-directory: client
        run: python3 scripts/lines.py

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are written for (also cancho.toml's `cancho`), and the cancho-mqtt commit whose `mqtt.wire` is the other
  # implementation of the byte layout (design section 9, gate 1): the commit cancho-industrial's bundle.toml pins.
  CANCHO_REV: a4572ea3b506e4bcec1c4be43deda1043c11ba9f
  BROKER_REV: ac2cde4434279d758dd8b4329a174f1fead6cb57

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-mqtt
          ref: ${{ env.BROKER_REV }}
          path: cancho-mqtt

      - name: The compiler pin in cancho.toml is the one CI builds
        working-directory: client
        run: grep -q "$CANCHO_REV" cancho.toml

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Format
        working-directory: client
        run: ${{ github.workspace }}/cancho/target/release/cancho fmt --check src tests

      - name: Gates 1, 2 and 6, the tests (the codec's own and against cancho-mqtt's wire)
        working-directory: client
        run: |
          C=${{ github.workspace }}/cancho/target/release/cancho
          $C test src/codec.cho tests/codec_test.cho --std
          $C test ../cancho-mqtt/src/wire.cho src/codec.cho tests/broker_test.cho --std

      - name: Gate 7, every variant must be killed
        working-directory: client
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: python3 scripts/mutants.py

      - name: Gate 8, lines
        working-directory: client
        run: python3 scripts/lines.py

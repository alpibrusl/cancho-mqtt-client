# cancho-mqtt-client's project file: the compiler these sources are written for. The compiler revision is part of the contract
# (a package store records no hash of the `std` it was published against); it is also CI's CLIENT_COMPILER_REV (design section 8).

[package]
name = "mqtt-client"
cancho = "a4572ea3b506e4bcec1c4be43deda1043c11ba9f"

[[test]]
name = "codec"
sources = ["src/codec.cho", "tests/codec_test.cho"]
std = true

# Gate 1: the other implementation of the byte layout is cancho-mqtt's `mqtt.wire`, from a checkout beside this one at the commit
# `bundle`-style pins name (docs/design.md section 9); CI checks the checkout is at that commit.
[[test]]
name = "broker"
sources = ["../cancho-mqtt/src/wire.cho", "src/codec.cho", "tests/broker_test.cho"]
std = true

[[test]]
name = "client"
sources = ["src/codec.cho", "src/client.cho", "tests/client_test.cho"]
std = true

# The two example programs (design section 11, slice 2): the caller's side of the state machine, over a blocking connection.
[[bin]]
name = "pub"
sources = ["examples/pump.cho", "examples/pub.cho", "src/codec.cho", "src/client.cho"]
std = true
out = "build/pub"

[[bin]]
name = "sub"
sources = ["examples/pump.cho", "examples/sub.cho", "src/codec.cho", "src/client.cho"]
std = true
out = "build/sub"

# Slice 4: a connection that carries a will and ends two ways.
[[bin]]
name = "will"
sources = ["examples/pump.cho", "examples/will.cho", "src/codec.cho", "src/client.cho"]
std = true
out = "build/will"

# Slice 5: a subscriber that waits and reconnects.
[[bin]]
name = "watch"
sources = ["examples/pump.cho", "examples/watch.cho", "src/codec.cho", "src/client.cho"]
std = true
out = "build/watch"
